# =============================================================================
# SIPSE-Inspector - Pipeline de Integración Continua
# Ubicación en el repositorio: .github/workflows/ci.yml
# =============================================================================
# Se dispara con cada push y pull request hacia la rama main.
# Ejecuta en orden:
#   1. Pruebas unitarias del backend con pytest-cov (cobertura)
#   2. Pruebas E2E con Selenium en modo headless contra la app FastAPI
#   3. Análisis de calidad con SonarCloud (complejidad, mantenibilidad, cobertura)
# =============================================================================

name: CI - SIPSE-Inspector

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1: Pruebas unitarias del backend + reporte de cobertura
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Pruebas unitarias y cobertura
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # SonarCloud necesita el historial completo

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar pipenv
        run: |
          python -m pip install --upgrade pip
          pip install pipenv

      - name: Instalar dependencias del proyecto
        run: pipenv install --dev --python $(which python)

      - name: Ejecutar pruebas unitarias con cobertura
        run: |
          pipenv run pytest \
            tests/test_user_service.py \
            tests/test_main.py \
            --cov=src \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --junitxml=pytest-report.xml

      - name: Publicar reporte de cobertura como artefacto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            coverage.xml
            pytest-report.xml
          retention-days: 30

  # ---------------------------------------------------------------------------
  # JOB 2: Pruebas End-to-End con Selenium (modo headless)
  # ---------------------------------------------------------------------------
  e2e-tests:
    name: Pruebas E2E con Selenium
    runs-on: ubuntu-latest
    needs: unit-tests   # Solo se ejecuta si pasan las pruebas unitarias

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar pipenv
        run: |
          python -m pip install --upgrade pip
          pip install pipenv

      - name: Instalar dependencias del proyecto
        run: pipenv install --dev --python $(which python)

      - name: Configurar Google Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Levantar backend FastAPI (puerto 8000)
        run: |
          pipenv run uvicorn src.main:app --host 0.0.0.0 --port 8000 &
          for i in {1..30}; do
            if curl -s http://localhost:8000/docs > /dev/null; then
              echo "Backend listo en :8000"
              break
            fi
            echo "Esperando backend... ($i/30)"
            sleep 1
          done

      - name: Levantar frontend estático (puerto 5500)
        run: |
          cd src
          python -m http.server 5500 &
          cd ..
          for i in {1..15}; do
            if curl -s http://localhost:5500/index.html > /dev/null; then
              echo "Frontend listo en :5500"
              break
            fi
            echo "Esperando frontend... ($i/15)"
            sleep 1
          done

      - name: Ejecutar pruebas Selenium (headless)
        env:
          HEADLESS: "true"
          BASE_URL: "http://localhost:5500"
        run: |
          pipenv run pytest \
            tests/test_registro_exitoso_cp01.py \
            tests/test_email_invalido_cp03.py \
            tests/test_username_vacio_cp04.py \
            tests/test_rol_vacio_cp05.py \
            tests/test_registro_duplicado_cp06.py \
            tests/test_registro_fallido_password_c*.py \
            --junitxml=e2e-report.xml \
            -v

      - name: Publicar reporte E2E como artefacto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: e2e-report.xml
          retention-days: 30

  # ---------------------------------------------------------------------------
  # JOB 3: Análisis de calidad con SonarCloud
  # ---------------------------------------------------------------------------
  sonar-analysis:
    name: Análisis SonarCloud
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar reporte de cobertura
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: Ejecutar SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.python.xunit.reportPath=pytest-report.xml

      - name: Verificar Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
